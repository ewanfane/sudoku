<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader-overlay" class="hidden">
        <div class="loader-text">Generating Puzzle...</div>
    </div>
    <header>
        <h1>Sudoku</h1>
        <div class="controls">
            <div class="difficulty">
                <label for="difficulty-select">Difficulty:</label>
                <select id="difficulty-select">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                    <option value="very-hard">Very Hard</option>
                </select>
            </div>
            <div id="timer" class="timer">00:00</div>
    <button id="new-game-btn" class="btn">New Game</button>
    <button id="hint-btn" class="btn">Hint</button>
    <button id="notes-btn" class="btn">Notes</button>
        </div>
        <div class="theme-switcher">
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
            <label for="theme-toggle">Dark Mode</label>
        </div>
    </header>
    <main>
        <div id="sudoku-board"></div>
        <div class="numpad">
            <div class="numpad-btn" data-num="1">1</div>
            <div class="numpad-btn" data-num="2">2</div>
            <div class="numpad-btn" data-num="3">3</div>
            <div class="numpad-btn" data-num="4">4</div>
            <div class="numpad-btn" data-num="5">5</div>
            <div class="numpad-btn" data-num="6">6</div>
            <div class="numpad-btn" data-num="7">7</div>
            <div class="numpad-btn" data-num="8">8</div>
            <div class="numpad-btn" data-num="9">9</div>
            <div class="numpad-btn" id="erase-btn">Erase</div>
        </div>
    </main>
    <script src="sudoku.js"></script>
    <script src="app.js"></script>
</body>
</html>
